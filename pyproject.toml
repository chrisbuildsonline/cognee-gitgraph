[project]
name = "cognee-community-connector-gitgraph"
version = "0.1.0"
description = "Git history, Python AST symbols and CI failures as a cognee data-source connector, with PR blast radius"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<=3.13"
dependencies = [
    # Requires cognee "document-mode" (DOCUMENT_SOURCE_ATTR + resolve_dlt_sources),
    # first shipped in cognee 1.4.0. Pinned to the newest release at build time.
    "cognee==1.6.5",
    "dlt[sqlalchemy]>=1.9.0,<2",
    "GitPython>=3.1,<4",
    "networkx>=3,<4",
]

[project.urls]
Homepage = "https://github.com/topoteretes/cognee"
Repository = "https://github.com/topoteretes/cognee-community"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cognee_community_connector_gitgraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: runs real cognee with its local embedded stores"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "PGH", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
